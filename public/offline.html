<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión · Reserva la Palapa</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f7f4; color: #1c1917; font: 18px/1.5 system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 24px; }
    h1 { font-size: 26px; margin: 20px 0 8px; }
    button { margin-top: 20px; font: inherit; font-weight: 700; color: #fff; background: #059669; border: 0; border-radius: 16px; padding: 14px 24px; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>No hay conexión a internet</h1>
    <p>Revisa tu Wi-Fi o datos móviles y vuelve a intentarlo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
