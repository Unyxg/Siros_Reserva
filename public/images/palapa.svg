<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustración de una palapa al atardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="0.38" stop-color="#f59e0b"/>
      <stop offset="0.62" stop-color="#fb923c"/>
      <stop offset="0.8" stop-color="#fda4af"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7cc"/>
      <stop offset="0.6" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15803d"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <g id="palm">
      <path d="M0 0 C 6 -120 -4 -240 14 -360" stroke="#422006" stroke-width="16" fill="none" stroke-linecap="round"/>
      <g fill="#14532d" transform="translate(14 -360)">
        <path d="M0 0 C -60 -40 -130 -20 -170 30 C -110 0 -60 0 0 0Z"/>
        <path d="M0 0 C 60 -45 140 -30 175 25 C 115 -5 60 -5 0 0Z"/>
        <path d="M0 0 C -30 -70 -100 -100 -150 -80 C -90 -60 -40 -40 0 0Z"/>
        <path d="M0 0 C 30 -75 100 -105 150 -85 C 95 -60 40 -40 0 0Z"/>
        <path d="M0 0 C -10 -60 10 -110 30 -130 C 20 -80 15 -40 0 0Z"/>
        <path d="M0 0 C -70 10 -120 60 -130 110 C -90 60 -50 30 0 0Z"/>
        <path d="M0 0 C 70 10 120 60 128 112 C 88 62 50 30 0 0Z"/>
      </g>
      <circle cx="8" cy="-352" r="9" fill="#78350f"/><circle cx="22" cy="-348" r="9" fill="#92400e"/>
    </g>
  </defs>

  <!-- sky & sun -->
  <rect width="800" height="1000" fill="url(#sky)"/>
  <circle cx="560" cy="430" r="190" fill="url(#sun)"/>
  <circle cx="560" cy="430" r="80" fill="#fff7cc"/>
  <!-- birds -->
  <g stroke="#7c2d12" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M150 250 q14 -14 28 0 q14 -14 28 0"/>
    <path d="M230 210 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M620 190 q12 -12 24 0 q12 -12 24 0"/>
  </g>

  <!-- distant hills -->
  <path d="M0 560 C 140 490 260 520 380 500 C 520 475 640 530 800 490 L800 1000 L0 1000Z" fill="#0f766e" opacity="0.55"/>
  <path d="M0 620 C 160 560 300 600 440 580 C 590 560 690 600 800 575 L800 1000 L0 1000Z" fill="#047857" opacity="0.8"/>

  <!-- palm trees -->
  <use href="#palm" transform="translate(95 760) scale(1.05)"/>
  <use href="#palm" transform="translate(705 720) scale(-0.85 0.85)"/>

  <!-- lawn -->
  <path d="M0 700 C 200 660 600 660 800 700 L800 1000 L0 1000Z" fill="url(#grass)"/>

  <!-- palapa posts -->
  <g fill="#78350f">
    <rect x="262" y="560" width="18" height="215" rx="6"/>
    <rect x="522" y="560" width="18" height="215" rx="6"/>
  </g>
  <!-- thatched roof -->
  <path d="M400 330 L610 560 L190 560 Z" fill="url(#roof)"/>
  <g stroke="#92400e" stroke-width="3" opacity="0.55" fill="none">
    <path d="M400 340 L240 555"/><path d="M400 340 L300 555"/><path d="M400 340 L360 555"/>
    <path d="M400 340 L440 555"/><path d="M400 340 L500 555"/><path d="M400 340 L560 555"/>
    <path d="M330 420 Q400 410 470 420"/><path d="M280 480 Q400 465 520 480"/>
  </g>
  <!-- fringe -->
  <path d="M180 556 L620 556 L620 572 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 q-11 22 -22 0 Z" fill="#a16207"/>
  <path d="M392 322 L408 322 L404 300 L396 300Z" fill="#78350f"/>

  <!-- string lights -->
  <path d="M190 560 Q 110 620 30 600" stroke="#1c1917" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M610 560 Q 690 625 780 598" stroke="#1c1917" stroke-width="2" fill="none" opacity="0.6"/>
  <g fill="#fef08a">
    <circle cx="165" cy="580" r="7"/><circle cx="130" cy="598" r="7"/><circle cx="95" cy="606" r="7"/><circle cx="60" cy="605" r="7"/>
    <circle cx="640" cy="583" r="7"/><circle cx="675" cy="603" r="7"/><circle cx="710" cy="610" r="7"/><circle cx="745" cy="606" r="7"/>
  </g>
  <g fill="#fef08a" opacity="0.25">
    <circle cx="130" cy="598" r="16"/><circle cx="60" cy="605" r="16"/><circle cx="675" cy="603" r="16"/><circle cx="745" cy="606" r="16"/>
  </g>

  <!-- picnic table under the palapa -->
  <g fill="#92400e">
    <rect x="300" y="690" width="200" height="16" rx="5"/>
    <rect x="318" y="706" width="12" height="60" rx="4"/>
    <rect x="470" y="706" width="12" height="60" rx="4"/>
    <rect x="285" y="735" width="230" height="10" rx="4" fill="#78350f"/>
  </g>
  <!-- little details on the table -->
  <circle cx="360" cy="684" r="9" fill="#f43f5e"/>
  <rect x="425" y="668" width="14" height="22" rx="4" fill="#0ea5e9"/>
  <path d="M390 690 q10 -26 20 0Z" fill="#facc15"/>

  <!-- bougainvillea bushes -->
  <g>
    <ellipse cx="170" cy="800" rx="95" ry="55" fill="#166534"/>
    <g fill="#ec4899"><circle cx="120" cy="780" r="14"/><circle cx="150" cy="765" r="12"/><circle cx="190" cy="772" r="15"/><circle cx="225" cy="790" r="12"/><circle cx="140" cy="805" r="11"/><circle cx="200" cy="808" r="10"/></g>
    <g fill="#f9a8d4"><circle cx="170" cy="785" r="8"/><circle cx="110" cy="800" r="7"/><circle cx="235" cy="775" r="7"/></g>
    <ellipse cx="640" cy="815" rx="110" ry="58" fill="#166534"/>
    <g fill="#d946ef"><circle cx="585" cy="795" r="14"/><circle cx="620" cy="778" r="13"/><circle cx="665" cy="785" r="15"/><circle cx="705" cy="805" r="12"/><circle cx="610" cy="820" r="11"/><circle cx="680" cy="822" r="10"/></g>
    <g fill="#f0abfc"><circle cx="640" cy="800" r="8"/><circle cx="575" cy="815" r="7"/><circle cx="715" cy="788" r="7"/></g>
  </g>

  <!-- stone path -->
  <g fill="#e7e5e4" opacity="0.85">
    <ellipse cx="400" cy="820" rx="42" ry="12"/><ellipse cx="385" cy="870" rx="50" ry="14"/><ellipse cx="410" cy="930" rx="60" ry="16"/>
  </g>
</svg>
